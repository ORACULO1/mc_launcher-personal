<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Actualizando Chechenitza Studio</title>
<style>
  :root {
    --bg: #12161d; --bg-elevated: #181e27; --border: #2b323c;
    --text: #f1ede0; --text-dim: #8f979f;
    --accent-a: #d0c8a4; --accent-b: #b8ad87; --accent-c: #e9e0b4;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default;
  }
  .card {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 26px 34px; border: 1px solid var(--border); background: var(--bg);
  }
  .logo { width: 58px; height: 58px; object-fit: contain; margin-bottom: 14px; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: .2px; }
  .versions { margin-top: 5px; font-size: 12.5px; color: var(--text-dim); min-height: 17px; }
  .bar {
    position: relative; width: 100%; height: 8px; margin-top: 22px; overflow: hidden;
    border-radius: 99px; background: var(--bg-elevated); border: 1px solid var(--border);
  }
  .fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent-b), var(--accent-a), var(--accent-c));
    transition: width .15s linear;
  }
  .bar.busy .fill {
    position: absolute; width: 38%; transition: none;
    animation: slide 1.15s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -40%; } 100% { left: 102%; } }
  .row { display: flex; justify-content: space-between; width: 100%; margin-top: 9px; font-size: 12px; color: var(--text-dim); }
  .row .pct { color: var(--text); font-variant-numeric: tabular-nums; }
  .error h1, .error .status { color: var(--danger); }
</style>
</head>
<body>
  <div class="card" id="card">
    <img class="logo" src="assets/logo.png" alt="">
    <h1 id="title">Actualizando</h1>
    <div class="versions" id="versions"></div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="row"><span class="status" id="status">Descargando actualización…</span><span class="pct" id="pct">0%</span></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  function setVersions(from, to) { $("versions").textContent = "v" + from + "  →  v" + to; }
  function setProgress(percent, detail) {
    const p = Math.max(0, Math.min(100, percent));
    $("fill").style.width = p + "%";
    $("pct").textContent = Math.floor(p) + "%";
    $("status").textContent = detail ? "Descargando · " + detail : "Descargando actualización…";
  }
  function setInstalling() {
    $("title").textContent = "Instalando";
    $("bar").classList.add("busy");
    $("status").textContent = "Instalando actualización… no cierres esta ventana";
    $("pct").textContent = "";
  }
  function setError() {
    $("card").classList.add("error");
    $("title").textContent = "No se pudo actualizar";
    $("bar").classList.remove("busy");
    $("status").textContent = "Abriendo el launcher…";
    $("pct").textContent = "";
  }

  // Recibe órdenes de la ventana principal (tauri-bridge.js) y avisa cuando está lista.
  (function () {
    const T = window.__TAURI__;
    if (!T) return;
    T.event.listen("updater-ui", (e) => {
      const m = e.payload || {};
      if (m.type === "versions") setVersions(m.from, m.to);
      else if (m.type === "progress") setProgress(m.percent, m.detail);
      else if (m.type === "installing") setInstalling();
      else if (m.type === "error") setError();
      else if (m.type === "close") T.window.getCurrentWindow().close();
    }).then(() => T.event.emit("updater-ready", {}));
  })();
</script>
</body>
</html>
